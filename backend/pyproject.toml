[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "savehaven-backend"
version = "0.1.0"
description = "FastAPI backend for the SaveHaven hackathon project"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.129,<0.130",
    "httpx>=0.28,<0.29",
    "itsdangerous>=2.2,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "auth*",
    "database*",
    "integrations*",
    "models*",
    "repository*",
    "schemas*",
    "services*",
]

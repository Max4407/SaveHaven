name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: savehaven:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        run: |
          docker run --detach --name savehaven-ci --publish 8000:8000 \
            --env APP_ENV=production \
            --env DATABASE_URL=sqlite:////tmp/savehaven.db \
            --env FRONTEND_ORIGIN=https://savehaven.example \
            --env SESSION_COOKIE_SECURE=true \
            --env SESSION_SECRET=ci-only-session-secret-that-is-never-used-outside-this-job \
            --env NESSIE_DATA_MODE=fixture \
            --env NESSIE_ALLOW_FIXTURE_FALLBACK=true \
            savehaven:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/town | grep --quiet '<div id="root"></div>'
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force savehaven-ci || true
